name: CI

# Verifies every pull request and every push to main. Publishing is handled
# separately by publish.yml (tag-triggered) and is never run from here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Verify package was produced
        run: ls -l ./*.vsix
